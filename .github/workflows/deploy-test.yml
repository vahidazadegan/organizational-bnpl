name: Deploy test

on:
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  checks: read

jobs:
  deploy:
    name: Deploy to test VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Checking CI for ${SHA}"

          # Latest completed CI run on main; must match this SHA and succeed.
          RUN_JSON="$(gh run list \
            --workflow ci.yml \
            --branch main \
            --limit 20 \
            --json databaseId,headSha,conclusion,status,displayTitle)"

          MATCH="$(echo "${RUN_JSON}" | jq -c --arg sha "${SHA}" '
            map(select(.headSha == $sha and .status == "completed")) | .[0] // empty
          ')"

          if [[ -z "${MATCH}" ]]; then
            echo "No completed CI run found for commit ${SHA} on main." >&2
            echo "Push/merge to main and wait for CI, then re-run this workflow." >&2
            exit 1
          fi

          CONCLUSION="$(echo "${MATCH}" | jq -r .conclusion)"
          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "CI conclusion for ${SHA} is '${CONCLUSION}', expected success." >&2
            exit 1
          fi

          echo "CI is green for ${SHA}"

      # VPS does not need a GitHub Deploy Key: Actions ships the tree over SSH.
      - name: Pack release
        run: |
          set -euo pipefail
          tar -czf bnpl-release.tgz \
            --exclude='./.git' \
            --exclude='./graphify-out' \
            --exclude='./.idea' \
            --exclude='./node_modules' \
            --exclude='*/node_modules' \
            --exclude='*/target' \
            --exclude='./deploy/.env' \
            --exclude='*.local' \
            .

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: bnpl-release.tgz
          target: /tmp/
          overwrite: true

      - name: Extract and deploy over SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -euo pipefail
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            mkdir -p "${DEPLOY_PATH}"

            if [[ -f "${DEPLOY_PATH}/deploy/.env" ]]; then
              cp "${DEPLOY_PATH}/deploy/.env" /tmp/bnpl-deploy.env.bak
            fi

            tar -xzf /tmp/bnpl-release.tgz -C "${DEPLOY_PATH}"

            if [[ -f /tmp/bnpl-deploy.env.bak ]]; then
              mkdir -p "${DEPLOY_PATH}/deploy"
              mv /tmp/bnpl-deploy.env.bak "${DEPLOY_PATH}/deploy/.env"
            fi

            if [[ ! -f "${DEPLOY_PATH}/deploy/.env" ]]; then
              echo "Missing ${DEPLOY_PATH}/deploy/.env" >&2
              echo "On the VPS: cp ${DEPLOY_PATH}/deploy/.env.example ${DEPLOY_PATH}/deploy/.env && edit values" >&2
              exit 1
            fi

            if [[ ! -f "${DEPLOY_PATH}/scripts/deploy-test.sh" ]]; then
              echo "scripts/deploy-test.sh missing after extract — check DEPLOY_PATH=${DEPLOY_PATH}" >&2
              ls -la "${DEPLOY_PATH}" >&2 || true
              exit 1
            fi

            chmod +x "${DEPLOY_PATH}/scripts/deploy-test.sh"
            SKIP_GIT_PULL=1 "${DEPLOY_PATH}/scripts/deploy-test.sh"
