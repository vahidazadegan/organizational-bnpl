server:
  port: 8083

spring:
  application:
    name: merchant-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bnpl_db}
    username: ${DB_USER:bnpl}
    password: ${DB_PASSWORD:bnpl@nilva}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  liquibase:
    enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-dev-secret-key-32b-min}
      issuer: ${JWT_ISSUER:merchant-service}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:180}
    length: ${OTP_LENGTH:6}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    fixed-code: ${OTP_FIXED_CODE:123456}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,db
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.organizational.bnpl.merchant: DEBUG
