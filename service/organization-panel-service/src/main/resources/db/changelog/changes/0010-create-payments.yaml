databaseChangeLog:
  - changeSet:
      id: 0010-create-payments
      author: organizational-bnpl
      comment: Create payments table for installment payment records
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payments
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: installment_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  defaultValue: IRR
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: varchar(30)
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: varchar(100)
              - column:
                  name: external_reference
                  type: varchar(100)
              - column:
                  name: paid_at
                  type: timestamp
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_payment_user
        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: installment_id
            referencedTableName: installments
            referencedColumnNames: id
            constraintName: fk_payment_installment
