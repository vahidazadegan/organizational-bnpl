databaseChangeLog:
  - changeSet:
      id: 0009-create-installments
      author: organizational-bnpl
      comment: Create installments table for purchase payment schedule
      changes:
        - createTable:
            tableName: installments
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_installments
                    nullable: false
              - column:
                  name: purchase_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: installment_number
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: paid_amount
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: paid_at
                  type: timestamp
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: installments
            columnNames: purchase_id, installment_number
            constraintName: uk_installment_number
        - addForeignKeyConstraint:
            baseTableName: installments
            baseColumnNames: purchase_id
            referencedTableName: purchases
            referencedColumnNames: id
            constraintName: fk_installment_purchase
