databaseChangeLog:
  - changeSet:
      id: 0005-create-user-organizations
      author: organizational-bnpl
      comment: Create user_organizations join table linking users to organizations
      changes:
        - createTable:
            tableName: user_organizations
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_organizations
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user_organizations
            columnNames: user_id, organization_id
            constraintName: uk_uo
        - addForeignKeyConstraint:
            baseTableName: user_organizations
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_uo_user
        - addForeignKeyConstraint:
            baseTableName: user_organizations
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_uo_org
