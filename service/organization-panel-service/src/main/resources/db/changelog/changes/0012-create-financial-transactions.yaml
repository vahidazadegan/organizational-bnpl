databaseChangeLog:
  - changeSet:
      id: 0012-create-financial-transactions
      author: organizational-bnpl
      comment: Create financial_transactions table for general financial ledger entries
      changes:
        - createTable:
            tableName: financial_transactions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_financial_transactions
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
              - column:
                  name: organization_id
                  type: uuid
              - column:
                  name: type
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  defaultValue: IRR
                  constraints:
                    nullable: false
              - column:
                  name: reference_type
                  type: varchar(50)
              - column:
                  name: reference_id
                  type: uuid
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: financial_transactions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_ft_user
        - addForeignKeyConstraint:
            baseTableName: financial_transactions
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_ft_org
