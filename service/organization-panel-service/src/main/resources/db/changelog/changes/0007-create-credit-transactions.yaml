databaseChangeLog:
  - changeSet:
      id: 0007-create-credit-transactions
      author: organizational-bnpl
      comment: Create credit_transactions table for user credit ledger entries
      changes:
        - createTable:
            tableName: credit_transactions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credit_transactions
                    nullable: false
              - column:
                  name: user_credit_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: balance_before
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: balance_after
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: reference_type
                  type: varchar(50)
              - column:
                  name: reference_id
                  type: uuid
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: credit_transactions
            columnNames: reference_id
            constraintName: uk_ct_reference_id
        - addForeignKeyConstraint:
            baseTableName: credit_transactions
            baseColumnNames: user_credit_id
            referencedTableName: user_credits
            referencedColumnNames: id
            constraintName: fk_ct_user_credit
