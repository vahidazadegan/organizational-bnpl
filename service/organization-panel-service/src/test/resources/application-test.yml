spring:
  datasource:
    url: jdbc:h2:mem:organization_panel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # JwtDecoder bean from TestJwtDecoderConfig replaces issuer discovery in tests.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.test/realms/bnpl
