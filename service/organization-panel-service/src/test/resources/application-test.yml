spring:
  datasource:
    url: jdbc:h2:mem:organization_panel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  security:
    jwt:
      secret: test-secret-key-that-is-long-enough-32b
      issuer: organization-panel-service-test
      expiration-seconds: 3600
