spring:
  datasource:
    url: jdbc:h2:mem:admin_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false

app:
  security:
    jwt:
      secret: test-secret-key-that-is-long-enough-32b
      issuer: admin-service-test
      expiration-seconds: 3600
